# ReFeree container.
#
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm validate
#   docker compose -f docker/docker-compose.yml run --rm referee      # shell
#
# Datasets are mounted read-only. Override the host paths with REFEREE_MULRAN_HOST
# and REFEREE_RADAR_HOST if they live elsewhere.

x-referee: &referee
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: referee:humble
  network_mode: host
  ipc: host
  environment:
    - DISPLAY=${DISPLAY:-}
    - QT_X11_NO_MITSHM=1
    - ROS_DOMAIN_ID=0
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Sources are mounted so host edits need no image rebuild. Read-only:
    # build trees live under /opt/referee, so a run leaves the host repo clean.
    - ../cpp:/referee/cpp:ro
    - ../docker:/referee/docker:ro
    - ../ros2_ws:/referee/ros2_ws:ro
    # Datasets, read-only.
    - ${REFEREE_RADAR_HOST:-/nas2/Radar_Datasets}:/data/radar:ro
    # Sessions and their results: the one place a run may write.
    - ${REFEREE_SESSIONS_HOST:-/storage/Datasets/ReFeree/referee_sessions}:/data/sessions
    # `docker compose run` starts a fresh container each time, so the workspace
    # build has to outlive it. Kept off the host to stay out of the repository.
    - referee-ros-build:/opt/referee/ros-build
    - referee-ros-install:/opt/referee/ros-install
  working_dir: /referee

services:
  # Interactive shell. referee-build-core / referee-build / referee-validate are
  # defined by the entrypoint.
  referee:
    <<: *referee
    container_name: referee
    stdin_open: true
    tty: true
    command: bash

  # Rebuild the mounted C++ core, then run every check.
  validate:
    <<: *referee
    container_name: referee_validate
    command: bash -lc "referee-build-core && referee-validate"

  # Build the ROS 2 workspace (odometry + LT-SLAM), once it is populated.
  build:
    <<: *referee
    container_name: referee_build
    command: bash -lc "referee-build-core && referee-build"

volumes:
  referee-ros-build:
  referee-ros-install:
